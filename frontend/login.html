<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Login | CareerBloom</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c5364;
        }

        .login-container p {
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
            color: #555;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2c5364;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2c5364;
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: #203a43;
        }

        .extra-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .extra-links a {
            text-decoration: none;
            color: #2c5364;
            font-weight: 600;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .extra-links p {
            margin: 0;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgb(51, 204, 218);
            color: #000;
            padding: 14px 26px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 0 20px rgb(121, 224, 233);
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            top: 40px;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <h2>CareerBloom</h2>
        <p>AI powered career recommendation for Students</p>
        
        <p id="error" style="color:red; text-align:center;"></p>

        <form action="http://127.0.0.1:5000/login" method="POST" id="loginform">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required autocomplete="off">
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div class="extra-links">
                <p>Don't have an account? <a href="/register-page">Register</a></p>
                <p><a href="/forgot-password">Forgot Password?</a></p>
            </div>
        </form>
    </div>
<div id="toast" class="toast">Login Successful!</div>
    <script>
        window.onload = function() {
            document.getElementById("loginform").reset();
        };

        const params = new URLSearchParams(window.location.search);
        if (params.get("error") === "invalid") {
            document.getElementById("error").innerText = "Invalid email or password. Please try again.";
        }
    </script>
<script>
const params2 = new URLSearchParams(window.location.search);

if (params2.get("reset") === "success") {
    const toast = document.getElementById("toast");
    toast.innerText = "Password Changed Successfully!";
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}
</script>

</body>
</html>
