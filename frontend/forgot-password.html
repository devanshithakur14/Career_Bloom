<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password | CareerBloom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .container {
            background: #fff;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #2c5364;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2c5364;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #203a43;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #2c5364;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Forgot Password</h2>
        <p>Enter your registered email to reset password</p>

<form action="/forgot-password" method="POST">
    <input type="email" name="email" placeholder="Enter your email" required> 

    <input type="text" name="fav_subject" placeholder="What is your favourite subject?" required>
    <p id="error" style="color:red;text-align:center;"></p>

    <button type="submit">Continue</button>
 </form> 

    <a href="/login-page">Back to Login</a>
        </div>
<script>
const params = new URLSearchParams(window.location.search);

if (params.get("error") === "subject") {
    document.getElementById("error").innerText = "Incorrect subject name";
}

if (params.get("error") === "email") {
    document.getElementById("error").innerText = "Email not registered";
}
</script>

</body>

</html>
