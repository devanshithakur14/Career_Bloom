<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/static/logo.png">


<meta charset="UTF-8">
<title>Home | CareerBloom</title>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

/* NAVBAR */
.navbar {
    position: absolute;
    top: 0;
    width: 100%;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    z-index: 100; /* Ensure navbar stays on top */
    box-sizing: border-box;
}

.nav-left {
    display: flex;
    align-items: center; /* Vertically centers logo with text */
    gap: 12px;           /* Space between logo and text */
    font-size: 24px;
    letter-spacing: 1px;
    font-weight: bold;
    color: #00eaff;
}

.logo {
    width: 60px;        /* Adjust size as needed */
    height: 60px;
    object-fit: contain;
    /* Optional: filter: drop-shadow(0 0 5px #00eaff); -> adds glow to logo */
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-right a {
    color: #fff;
    text-decoration: none;
    font-size: 22px;
    transition: 0.3s ease;
}

.nav-right a:hover {
    color: #00eaff;
    text-shadow: 3px 3px 5px #00eaff;
}

/* IMPROVED PROFILE ICON */
.profile-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: url("https://cdn-icons-png.flaticon.com/512/149/149071.png") center/cover no-repeat;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease-in-out;
    background-color: #222; /* Fallback color */
}

/* Hover Effect: Glow and Scale */
.profile-icon:hover {
    transform: scale(1.1);
    border-color: #00eaff;
    box-shadow: 0 0 15px #00eaff, 0 0 30px rgba(0, 234, 255, 0.5);
}

/* Active Effect: Slight click press */
.profile-icon:active {
    transform: scale(0.95);
}

/* CENTER CONTENT */
.center-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
}

.center-content h1 {
    font-size: 48px;
    margin-bottom: 20px;
    color: #ffffff;
    text-shadow: 0 0 20px #00eaff;
}

.center-content button {
    background: #00eaff;
    border: none;
    padding: 14px 40px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    color: black;
    transition: 0.3s ease;
    box-shadow: 0 0 15px #00eaff;
}

.center-content button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 25px #00eaff;
}

/* MOVING CARDS BACKGROUND */
.moving-cards {
    position: absolute;
    top: 55%;
    left: 0;
    width: 200%;
    display: flex;
    gap: 40px;
    transform: translateY(-50%);
    animation: slideCards 22s linear infinite;
}

.card {
    width: 260px;
    height: 380px;
    border-radius: 20px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 0 25px rgba(0,255,255,0.25);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px rgba(0,255,255,0.8);
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
footer {
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 14px;
    margin-top: 580px;
}
@keyframes slideCards {
    0% { transform: translateX(0) translateY(-50%); }
    100% { transform: translateX(-50%) translateY(-50%); }
}
#menuToggle:checked ~ .dashboard {
    left: 0;
}

#menuToggle:checked ~ #overlay {
    display: block;
}
/* Dashboard Sidebar */
/* Dashboard Sidebar */
.dashboard {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100vh;
    background: #0b0b0b;
    transition: 0.3s ease;
    z-index: 3000;
    padding-top: 10px;
}

.dashboard.active {
    left: 0;
}

/* Header */
.dashboard-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    padding: 20px;
}

.dashboard-header h3 {
    margin: 0;
    color: #00eaff;
}

/* Close button */
.close-btn {
    font-size: 26px;
    cursor: pointer;
}

/* Menu */
.dashboard-menu {
    list-style: none;
    padding: 0 20px;   /* ← aligns with header padding */
    margin: 0;
}

.dashboard-menu li {
    margin-bottom: 20px;
}

.dashboard-menu a {
    display: block;
    text-decoration: none;
    color: #fff;
    font-size: 22px;
    transition: 0.3s ease;
}

.dashboard-menu a:hover {
    color: #00eaff;
    text-shadow: 3px 3px 5px #00eaff;
}

.logout a {
    color: #ff4d4d;
}

.logout a:hover {
    color: #ff4d4d;
    text-shadow: 3px 3px 5px;
    box-shadow: none;
}



/* Overlay */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 2500;
}

#overlay.active {
    display: block;
}

.hamburger{
    cursor: pointer;
}

/* PROFILE DROPDOWN (LOGOUT) */
.profile-wrapper {
    position: relative;
}

.profile-menu {
    position: absolute;
    top: 45px; /* ⬅ closer to icon (was 55px) */
    right: 0;

    background: rgba(0,0,0,0.95);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,234,255,0.6);
    min-width: 160px;

    opacity: 0;
    transform: translateY(-5px);
    pointer-events: none;
    transition: all 0.25s ease;
}

/* invisible hover buffer */
.profile-menu::before {
    content: "";
    position: absolute;
    top: -15px;
    left: 0;
    width: 100%;
    height: 15px;
}

/* SHOW MENU ON HOVER */
.profile-wrapper:hover .profile-menu {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.profile-menu a {
    display: block;
    padding: 12px;
    color: #fff;
    text-decoration: none;
    text-align: center;
    border-radius: 12px;
    font-size: 16px;
}

.profile-menu a:hover {
    background: #00eaff;
    color: #000;
    font-weight: bold;
}
/* LOGIN SUCCESS TOAST */
.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgb(51, 204, 218);
    color: #000;
    padding: 14px 26px;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 0 20px rgb(121, 224, 233);
    opacity: 0;
    pointer-events: none;
    transition: 0.4s ease;
    z-index: 9999;
}

.toast.show {
    opacity: 1;
    top: 40px;
}

</style>
</head>

<body>
<input type="checkbox" id="menuToggle" hidden>
<header class="navbar">
    <div class="nav-left">
    <label for="menuToggle" class="hamburger">☰</label>
    <img src="/static/logo.png" alt="Logo" class="logo">

    <span>CareerBloom</span>
</div>
    <div class="nav-right">

    <div class="profile-wrapper">
    <div class="profile-icon" title="Profile"></div>

    <div class="profile-menu">
        <a href="/profile">Profile</a>
        <a href="/change-password">Change password</a>
        <a href="/logout">Logout</a>
    </div>
</div>


</div>
</header>

<div class="center-content">
    <h1>Build Your Career</h1>
    <button onclick="window.location.href='/get-started'">
        Get Started
    </button>
</div>

<div class="moving-cards">
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSRw0GnD-FUCoEdWoxm_-kRUs-Jyrz2OqPfpA&s"></div>
    <div class="card"><img src="https://thumbs.dreamstime.com/b/adorable-robot-duo-holding-hands-ai-friendship-connection-adorable-robot-duo-holding-hands-ai-friendship-connection-370871704.jpg"></div>
    <div class="card"><img src="https://t3.ftcdn.net/jpg/05/90/82/32/360_F_590823233_97YNah2bYsEW9llwf7UNK5L3r1cM0Ei3.jpg"></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShmaVS3H-_0y9OE4pK2FJqOONI0KPRYpVaGA&s"></div>
    <div class="card"><img src="https://t4.ftcdn.net/jpg/06/40/17/79/360_F_640177911_T8R1sJ5hzBCKUWekOokNgBm31vPqxJei.jpg"></div>
    
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSRw0GnD-FUCoEdWoxm_-kRUs-Jyrz2OqPfpA&s"></div>
    <div class="card"><img src="https://thumbs.dreamstime.com/b/adorable-robot-duo-holding-hands-ai-friendship-connection-adorable-robot-duo-holding-hands-ai-friendship-connection-370871704.jpg"></div>
    <div class="card"><img src="https://t3.ftcdn.net/jpg/05/90/82/32/360_F_590823233_97YNah2bYsEW9llwf7UNK5L3r1cM0Ei3.jpg"></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShmaVS3H-_0y9OE4pK2FJqOONI0KPRYpVaGA&s"></div>
    <div class="card"><img src="https://t4.ftcdn.net/jpg/06/40/17/79/360_F_640177911_T8R1sJ5hzBCKUWekOokNgBm31vPqxJei.jpg"></div>
</div>

<!-- Sidebar Dashboard -->
<div id="dashboard" class="dashboard">
    <div class="dashboard-header">
        <span class="close-btn" onclick="toggleDashboard()">×</span>
        <h3>My Dashboard</h3>
    </div>

    <ul class="dashboard-menu">
    <li><a href="/home" data-link>Home</a></li>
    <li><a href="/about" data-link>About Us</a></li>
    <li><a href="/feedback" data-link>Feedback</a></li>
    <li class="logout"><a href="/logout" data-link>Logout</a></li>
    </ul>

</div>

<label id="overlay" for="menuToggle"></label>

<script>
const dashboard = document.getElementById("dashboard");
const overlay = document.getElementById("overlay");
const menuToggle = document.getElementById("menuToggle");

function toggleDashboard() {
    dashboard.classList.toggle("active");
    overlay.classList.toggle("active");
    menuToggle.checked = dashboard.classList.contains("active");
}

document.querySelectorAll("[data-link]").forEach(link => {
    link.addEventListener("click", function (e) {
        e.preventDefault();
        const url = this.getAttribute("href");
        const currentPath = window.location.pathname;

        dashboard.classList.remove("active");
        overlay.classList.remove("active");
        menuToggle.checked = false;

        setTimeout(() => {
            if (currentPath === url) {
                // FORCE reload if same page
                window.location.reload();
            } else {
                window.location.href = url;
            }
        }, 200);
    });
});

overlay.addEventListener("click", () => {
    dashboard.classList.remove("active");
    overlay.classList.remove("active");
    menuToggle.checked = false;
});
</script>
<div id="toast" class="toast">Login Successful!</div>
<footer>
    © 2026 CareerBloom. All rights reserved.
</footer>
<script>
const params = new URLSearchParams(window.location.search);

if (params.get("login") === "success") {
    const toast = document.getElementById("toast");
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}
</script>

</body>
</html>
