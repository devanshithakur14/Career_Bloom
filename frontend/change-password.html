<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/static/logo.png">
<meta charset="UTF-8">
<title>Change Password | CareerBloom</title>

<style>
body{
    margin:0;
    background:#000;
    font-family:Arial, sans-serif;
    color:white;
}

/* ================= NAVBAR (FROM HOME) ================= */
.navbar {
    position: absolute;
    top: 0;
    width: 100%;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    z-index: 100;
    box-sizing: border-box;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    letter-spacing: 1px;
    font-weight: bold;
    color: #00eaff;
}

.logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.hamburger{
    cursor:pointer;
}

/* PROFILE ICON */
.profile-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: url("https://cdn-icons-png.flaticon.com/512/149/149071.png") center/cover no-repeat;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease-in-out;
    background-color: #222;
}

.profile-icon:hover {
    transform: scale(1.1);
    border-color: #00eaff;
    box-shadow: 0 0 15px #00eaff, 0 0 30px rgba(0, 234, 255, 0.5);
}

/* PROFILE DROPDOWN */
.profile-wrapper {
    position: relative;
}

.profile-menu {
    position: absolute;
    top: 45px;
    right: 0;
    background: rgba(0,0,0,0.95);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,234,255,0.6);
    min-width: 160px;
    opacity: 0;
    transform: translateY(-5px);
    pointer-events: none;
    transition: all 0.25s ease;
}

.profile-menu::before {
    content: "";
    position: absolute;
    top: -15px;
    left: 0;
    width: 100%;
    height: 15px;
}

.profile-wrapper:hover .profile-menu {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.profile-menu a {
    display: block;
    padding: 12px;
    color: #fff;
    text-decoration: none;
    text-align: center;
    border-radius: 12px;
    font-size: 16px;
}

.profile-menu a:hover {
    background: #00eaff;
    color: #000;
    font-weight: bold;
}

/* DASHBOARD */
.dashboard {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100vh;
    background: #0b0b0b;
    transition: 0.3s ease;
    z-index: 3000;
    padding-top: 10px;
}

.dashboard.active {
    left: 0;
}

.dashboard-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    padding: 20px;
}

.dashboard-header h3 {
    margin: 0;
    color: #00eaff;
}

.close-btn {
    font-size: 26px;
    cursor: pointer;
}

.dashboard-menu {
    list-style: none;
    padding: 0 20px;
    margin: 0;
}

.dashboard-menu li {
    margin-bottom: 20px;
}

.dashboard-menu a {
    display: block;
    text-decoration: none;
    color: #fff;
    font-size: 22px;
    transition: 0.3s ease;
}

.dashboard-menu a:hover {
    color: #00eaff;
    text-shadow: 3px 3px 5px #00eaff;
}

.logout a {
    color: #ff4d4d;
}

/* OVERLAY */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 2500;
}

#overlay.active {
    display: block;
}

/* ================= YOUR ORIGINAL FORM ================= */
.form-container{
    position:absolute;
    top:55%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    background:#111;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,234,255,0.4);
    text-align:center;
}

.form-container h2{
    margin-bottom:25px;
    text-shadow:0 0 15px #00eaff;
}

.input-box{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border-radius:10px;
    border:none;
    outline:none;
    background:#000;
    color:white;
    box-shadow:0 0 10px rgba(0,234,255,0.3);
}

.input-box:focus{
    box-shadow:0 0 18px #00eaff;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:25px;
    background:#00eaff;
    color:black;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 15px #00eaff;
}

.submit-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #00eaff;
}

footer{
    text-align:center;
    padding:20px;
    color:#777;
    position:absolute;
    bottom:0;
    width:100%;
}
/* TOAST MESSAGE */
.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #00eaff;
    color: #000;
    padding: 14px 22px;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0 0 20px #00eaff;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 5000;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<input type="checkbox" id="menuToggle" hidden>

<header class="navbar">
    <div class="nav-left">
        <span class="hamburger" onclick="toggleDashboard()">☰</span>
        <img src="/static/logo.png" class="logo">
        <span>CareerBloom</span>
    </div>

    <div class="nav-right">
        <div class="profile-wrapper">
            <div class="profile-icon"></div>

            <div class="profile-menu">
                <a href="/profile">Profile</a>
                <a href="/change-password">Change Password</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </div>
</header>

<!-- Sidebar Dashboard -->
<div id="dashboard" class="dashboard">
    <div class="dashboard-header">
        <span class="close-btn" onclick="toggleDashboard()">×</span>
        <h3>My Dashboard</h3>
    </div>

    <ul class="dashboard-menu">
        <li><a href="/home" data-link>Home</a></li>
        <li><a href="/about" data-link>About Us</a></li>
        <li><a href="/feedback" data-link>Feedback</a></li>
        <li class="logout"><a href="/logout" data-link>Logout</a></li>
    </ul>
</div>

<label id="overlay" for="menuToggle"></label>

<div class="form-container">
<h2>Change Password</h2>
<p id="error" style="color:red; margin-bottom:15px; font-weight:bold;"></p>
<form id="changePassword" action="/change-password" method="POST">
    
<input type="password" name="old_password" placeholder="Old Password" class="input-box" required>

<input type="password" name="new_password" placeholder="New Password" class="input-box" required>

<input type="password" name="confirm_password" placeholder="Confirm Password" class="input-box" required>

<button type="submit" class="submit-btn">
Update Password
</button>

</form>
</div>
<div id="toast" class="toast">Password changed successfully!</div>
<footer>
© 2026 CareerBloom. All rights reserved.
</footer>

<script>
const dashboard = document.getElementById("dashboard");
const overlay = document.getElementById("overlay");
const menuToggle = document.getElementById("menuToggle");

function toggleDashboard() {
    dashboard.classList.toggle("active");
    overlay.classList.toggle("active");
    menuToggle.checked = dashboard.classList.contains("active");
}

document.querySelectorAll("[data-link]").forEach(link => {
    link.addEventListener("click", function (e) {
        e.preventDefault();
        const url = this.getAttribute("href");
        const currentPath = window.location.pathname;

        dashboard.classList.remove("active");
        overlay.classList.remove("active");
        menuToggle.checked = false;

        setTimeout(() => {
            if (currentPath === url) {
                window.location.reload();
            } else {
                window.location.href = url;
            }
        }, 200);
    });
});

overlay.addEventListener("click", () => {
    dashboard.classList.remove("active");
    overlay.classList.remove("active");
    menuToggle.checked = false;
});
</script>

<script>
const params = new URLSearchParams(window.location.search);

if (params.get("success") === "1") {
    const toast = document.getElementById("toast");
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);

    // ✅ SUCCESS
    if (params.get("success") === "1") {

        const toast = document.getElementById("toast");

        if (toast) {
            toast.classList.add("show");

            // ⏳ Show toast for 2 seconds
            setTimeout(() => {
                window.location.href = "/home";
            }, 2000);
        }
    }

    // ❌ WRONG OLD PASSWORD
    if (params.get("error") === "old") {
        document.getElementById("error").innerText =
            "Old password is incorrect!";
    }

    // ❌ PASSWORD MISMATCH
    if (params.get("error") === "nomatch") {
        document.getElementById("error").innerText =
            "New passwords do not match!";
    }

});
</script>
</body>
</html>
