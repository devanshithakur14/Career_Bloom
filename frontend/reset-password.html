<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password | CareerBloom</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}
.container{
    background:#fff;
    padding:35px;
    width:100%;
    max-width:400px;
    border-radius:12px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
}
h2{
    text-align:center;
    color:black;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:15px;
    font-size:14px;
}
button{
    width:100%;
    padding:12px;
    background:#2c5364;
    color:white;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#203a43;
}
.message{
    text-align:center;
    font-size:14px;
    margin-top:10px;
    color:green;
    display:none;
}
</style>

</head>

<body>

<div class="container">
    <h2>Set New Password</h2>

    <form action="/reset-password" method="POST" onsubmit="return validatePasswords()">
        <input type="password" name="password" id="pass1" placeholder="New Password" required>
        <input type="password" id="pass2" placeholder="Confirm Password" required>

        <button type="submit">Update Password</button>
    </form>
</div>
<script>
function validatePasswords() {
    let p1 = document.getElementById("pass1").value;
    let p2 = document.getElementById("pass2").value;

    if (p1 !== p2) {
        alert("Passwords do not match");
        return false;
    }
    return true;
}
</script>
</body>
</html>
