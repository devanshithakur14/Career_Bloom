<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/static/logo.png">
<title>Feedback | CareerBloom</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}

/* ================= NAVBAR (FROM HOME) ================= */
.navbar {
    position: absolute;
    top: 0;
    width: 100%;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    z-index: 100;
    box-sizing: border-box;
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: bold;
    color: #00eaff;
}

.logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.hamburger{
    cursor: pointer;
}

/* PROFILE DROPDOWN */
.profile-wrapper {
    position: relative;
}

.profile-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: url("https://cdn-icons-png.flaticon.com/512/149/149071.png") center/cover no-repeat;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s ease-in-out;
    background-color: #222;
}

.profile-icon:hover {
    transform: scale(1.1);
    border-color: #00eaff;
    box-shadow: 0 0 15px #00eaff;
}

.profile-menu {
    position: absolute;
    top: 45px;
    right: 0;
    background: rgba(0,0,0,0.95);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,234,255,0.6);
    min-width: 160px;
    opacity: 0;
    transform: translateY(-5px);
    pointer-events: none;
    transition: all 0.25s ease;
}

.profile-menu::before {
    content: "";
    position: absolute;
    top: -15px;
    left: 0;
    width: 100%;
    height: 15px;
}

.profile-wrapper:hover .profile-menu {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.profile-menu a {
    display: block;
    padding: 12px;
    color: #fff;
    text-decoration: none;
    text-align: center;
    border-radius: 12px;
}

.profile-menu a:hover {
    background: #00eaff;
    color: #000;
    font-weight: bold;
}

/* ================= DASHBOARD (FROM HOME) ================= */
/* Dashboard Sidebar */
.dashboard {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100vh;
    background: #0b0b0b;
    transition: 0.3s ease;
    z-index: 3000;
    padding-top: 10px;
}

.dashboard.active {
    left: 0;
}

/* Header */
.dashboard-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
    padding: 20px;
}

.dashboard-header h3 {
    margin: 0;
    color: #00eaff;
}

/* Close button */
.close-btn {
    font-size: 26px;
    cursor: pointer;
}

/* Menu */
.dashboard-menu {
    list-style: none;
    padding: 0 20px;
    margin: 0;
}

.dashboard-menu li {
    margin-bottom: 20px;
}

.dashboard-menu a {
    display: block;
    text-decoration: none;
    color: #fff;
    font-size: 22px;
    transition: 0.3s ease;
}

.dashboard-menu a:hover {
    color: #00eaff;
    text-shadow: 3px 3px 5px #00eaff;
}

.logout a {
    color: #ff4d4d;
}

.logout a:hover {
    color: #ff4d4d;
    text-shadow: 3px 3px 5px;
    box-shadow: none;
}

/* OVERLAY */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 2500;
}

#overlay.active {
    display: block;
}

/* ================= FEEDBACK FORM (UNCHANGED) ================= */
.feedback-container{
max-width:850px;
margin:140px auto;
padding:40px;
background:linear-gradient(145deg,#0a0a0a,#111);
border-radius:20px;
border:1px solid rgba(0,234,255,0.25);
}

.feedback-container h2{
text-align:center;
cursor:pointer;
color:#00eaff;
margin-bottom:30px;
}

.feedback-container label{
display:block;
margin-top:18px;
color:#ccc;
}

.feedback-container input,
.feedback-container select,
.feedback-container textarea{
width:100%;
padding:12px;
margin-top:8px;
border-radius:10px;
border:1px solid rgba(0,234,255,0.2);
background:#000;
color:#fff;
}

.feedback-container textarea{
height:120px;
resize:none;
}

.feedback-container button{
width:100%;
margin-top:25px;
padding:14px;
border:none;
border-radius:30px;
background:#00eaff;
color:#000;
font-size:18px;
cursor:pointer;
}

.feedback-container button:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00eaff;
}

footer{
text-align:center;
padding:25px;
color:#777;
}

/* TOAST MESSAGE */
.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #00eaff;
    color: #000;
    padding: 14px 22px;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0 0 20px #00eaff;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 5000;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

</style>
</head>

<body>

<input type="checkbox" id="menuToggle" hidden>

<header class="navbar">
    <div class="nav-left">
        <span class="hamburger" onclick="toggleDashboard()">☰</span>
        <img src="/static/logo.png" class="logo">
        <span>CareerBloom</span>
    </div>

    <div class="nav-right">
        <div class="profile-wrapper">
            <div class="profile-icon"></div>
            <div class="profile-menu">
                <a href="/profile">Profile</a>
                <a href="/change-password">Change Password</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </div>
</header>

<!-- Sidebar Dashboard -->
<div id="dashboard" class="dashboard">
    <div class="dashboard-header">
        <span class="close-btn" onclick="toggleDashboard()">×</span>
        <h3>My Dashboard</h3>
    </div>

    <ul class="dashboard-menu">
        <li><a href="/home" data-link>Home</a></li>
        <li><a href="/about" data-link>About Us</a></li>
        <li><a href="/feedback" data-link>Feedback</a></li>
        <li class="logout"><a href="/logout" data-link>Logout</a></li>
    </ul>
</div>

<div id="overlay" onclick="toggleDashboard()"></div>

<div class="feedback-container">
<h2>CareerBloom Feedback</h2>

<form id="feedbackForm" action="/submit-feedback" method="POST">
<label>Name</label>
<input type="text" name="name" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Your Role</label>
<select name="role" required>
<option disabled selected>Select</option>
<option>Student</option>
<option>Teacher</option>
<option>Other</option>
</select>

<label>Overall Experience</label>
<select name="experience" required>
<option disabled selected>Select</option>
<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Good</option>
<option>⭐⭐⭐ Average</option>
<option>⭐⭐ Poor</option>
<option>⭐ Very Bad</option>
</select>

<label>Suggestions</label>
<textarea name="suggestions"></textarea>

<button type="submit">Submit Feedback</button>
</form>
</div>

<div id="toast" class="toast">Feedback submitted!</div>
<footer>
© 2026 CareerBloom. All rights reserved.
</footer>

<script>
const dashboard = document.getElementById("dashboard");
const overlay = document.getElementById("overlay");
const menuToggle = document.getElementById("menuToggle");

function toggleDashboard() {
    dashboard.classList.toggle("active");
    overlay.classList.toggle("active");
    menuToggle.checked = dashboard.classList.contains("active");
}
</script>

<script>
const form = document.getElementById("feedbackForm");
const toast = document.getElementById("toast");

form.addEventListener("submit", function(e) {
    e.preventDefault();   // stop instant redirect

    toast.classList.add("show");

    // submit after showing toast
    setTimeout(() => {
        form.submit();
    }, 1200);
});
</script>

<script>
document.querySelectorAll("[data-link]").forEach(link => {
    link.addEventListener("click", function (e) {
        e.preventDefault();
        const url = this.getAttribute("href");
        const currentPath = window.location.pathname;

        dashboard.classList.remove("active");
        overlay.classList.remove("active");
        menuToggle.checked = false;

        setTimeout(() => {
            if (currentPath === url) {
                window.location.reload();
            } else {
                window.location.href = url;
            }
        }, 200);
    });
});
</script>                                                                 
</body>
</html>
