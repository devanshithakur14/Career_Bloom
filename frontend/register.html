    <!DOCTYPE html>
    <html lang="en">

    <head>
        <link rel="icon" type="image/png" href="logo.png">
        <meta charset="UTF-8">
        <title>Register | CareerBloom</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />


        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Segoe UI", Arial, sans-serif;
            }

            body {
                height: 100vh;
                background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

                display: flex;
                align-items: center;
                justify-content: center;

                overflow: hidden;   /* no scrollbar */
            }

            .login-container {
                background: #ffffff;
                width: 100%;
                max-width: 360px;   /* smaller width */
                padding: 25px;      /* reduced padding */
                border-radius: 10px;
                box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
            }

            .login-container h2 {
                text-align: center;
                margin-bottom: 10px;
                color: #2c5364;
                font-size: 22px;
            }

            .login-container p {
                text-align: center;
                font-size: 14px;
                margin-bottom: 18px;
                color: #555;
            }

            .form-group {
                 margin-bottom: 14px;  
            }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                font-size: 14px;
                color: #333;
            }

            .form-group input {
                width: 100%;
                padding: 9px;         
                border-radius: 6px;
                border: 1px solid #ccc;
                font-size: 13px;
            }

            .form-group input:focus {
                border-color: #2c5364;
                outline: none;
            }

            .login-btn {
                width: 100%;.login-btn {
                width: 100%;
                padding: 10px;
                border-radius: 20px;
                font-size: 14px;
            }
                padding: 12px;
                background: #2c5364;
                border: none;
                border-radius: 25px;
                color: #fff;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s ease;
            }

            .login-btn:hover {
                background: #203a43;
            }

            .extra-links {
                margin-top: 20px;
                text-align: center;
                font-size: 20px;
            }

            .extra-links a {
                text-decoration: none;
                color: #2c5364;
                font-weight: 600;
            }

            .extra-links a:hover {
                text-decoration: underline;
            }
        </style>
    </head>

    <body>

        <div class="login-container">
            <h2>CareerBloom</h2>
            <p>AI powered career recommendation for Students</p>

            <form action="http://127.0.0.1:5000/register" method="POST" id="registerform">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Enter your full name" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Email ID</label>
                    <input type="email" name="email" placeholder="Enter your email" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password"
                        placeholder="Enter your password again" required autocomplete="off">
                </div>
                <div class="form-group">
                        <label>Security Question</label>
                        <input type="text" name="fav_subject" placeholder="What is your favourite subject?"required>
                </div>

                <button type="submit" class="login-btn">Register</button>

                <div class="extra-links">
                    <p>Already have an account? <a href="/login-page">Login</a></p>
                </div>
            </form>
        </div>

                <script>
                    const password = document.getElementById("password");
                    const confirmPassword = document.getElementById("confirm_password");

                    function validatePasswords() {
                        if (password.value !== confirmPassword.value) {
                            confirmPassword.setCustomValidity("Passwords do not match");
                        } else {
                            confirmPassword.setCustomValidity(""); // clears the error
                        }
                    }

                    // Validate while typing
                    password.addEventListener("input", validatePasswords);
                    confirmPassword.addEventListener("input", validatePasswords);
                </script>

        <script>
            window.onload = function () {
                document.getElementById("registerform").reset();

            };
        </script>
    </body>
    </html>
